name: Azure Static Web Apps  Deploy Supplications Folder

on:
  workflow_dispatch:
  push:
    branches: [ AzkaarSalah ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy Supplication After Prayers
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_ROCK_034396B1E }}
          action: "upload"
          app_location: "Supplication After Prayers"
          api_location: ""
          app_build_command: "echo ""No build"""
          output_location: "."